trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Para un entorno de producción inyectaríamos este valor desde Azure Key Vault,
  # pero para mantener el laboratorio enfocado, usaremos una variable directa.
  SA_PASSWORD: 'Admin.Lab2026!'

steps:
- script: |
    echo "1. Levantando SQL Server efímero..."
    docker run -e 'ACCEPT_EULA=Y' -e "MSSQL_SA_PASSWORD=$(SA_PASSWORD)" -p 1433:1433 -d --name sqlci mcr.microsoft.com/mssql/server:2022-latest

    echo "2. Esperando 20 segundos a que el motor de base de datos inicie..."
    sleep 20
  displayName: 'Preparar base de datos de prueba'

- script: |
    echo "3. Validando scripts SQL con Flyway..."
    docker run --rm --network host -v $(System.DefaultWorkingDirectory)/sql:/flyway/sql flyway/flyway -url="jdbc:sqlserver://localhost:1433;encrypt=true;trustServerCertificate=true;" -user="SA" -password="$(SA_PASSWORD)" migrate
  displayName: 'Validar migraciones (CI)'
